name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # No LEDGER_TEST_DB_URL here, so tests start postgres:16-alpine via Testcontainers.
      - name: Test
        run: mvn -B verify
      - name: Docker image
        run: docker build -t ledgerline .
